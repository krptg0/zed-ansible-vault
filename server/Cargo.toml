[package]
name = "ansible-vault-lsp"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Language server exposing ansible-vault encrypt/decrypt code actions and hover"
publish = false

[[bin]]
name = "ansible-vault-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
